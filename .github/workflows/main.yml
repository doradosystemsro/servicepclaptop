name: Executa Setup Tina
on:
  workflow_dispatch:

jobs:
  tina-build:
    runs-on: ubuntu-latest
    steps:
      - name: Copiaza codul
        uses: actions/checkout@v4

      - name: Pune Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instaleaza pachetele si compileaza
        run: |
          npm install @tinacms/cli tinacms
          npx tinacms build --noTelemetry

      - name: Trimite fisierele compilate inapoi pe Github
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Generare manuala panou admin si tina-lock"
