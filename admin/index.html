<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panou Administrare Dorado Systems</title>
  <link rel="stylesheet" href="https://unpkg.com/@tinacms/toolkit@latest/dist/styles.css">
</head>
<body style="margin: 0; background: #13141f; font-family: sans-serif;">

  <div id="tina-admin-root"></div>

  <!-- Scriptul oficial de backend independent -->
  <script src="https://unpkg.com/@tinacms/boring-admin@latest/dist/index.js"></script>
  <script>
    BoringAdmin.renderAdmin({
      target: document.getElementById('tina-admin-root'),
      clientId: "8640bb63-3016-4565-a65a-62829d5758f7",
      branch: "main",
      isLocalBackend: false
    });

    // Forțăm activarea stării de editare la nivel global în fereastră
    window.addEventListener('load', () => {
      if (window.TinaCMS) {
        // Ne asigurăm că interfața intră direct în modul activ de producție
        window.TinaCMS.cms.flags.set("visual-editing", true);
      }
    });
  </script>

</body>
</html>
