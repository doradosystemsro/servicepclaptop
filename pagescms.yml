media:
  input: "images"
  output: "/images"

collections:
  - name: blog
    label: "Articole Blog"
    path: "blog"
    type: file
    fields:
      - name: title
        label: "Titlu Articol (H1)"
        type: string
      - name: date
        label: "Data Publicării"
        type: date
      - name: meta_title
        label: "SEO Meta Title (În Google)"
        type: string
      - name: meta_description
        label: "SEO Meta Description (În Google)"
        type: text
      - name: body
        label: "Corp Articol (Text)"
        type: rich-text
