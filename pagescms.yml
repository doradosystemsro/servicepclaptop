media:
  input: "assets" # Folderul tău de imagini/stiluri pe care l-am văzut în listă
  output: "/assets"

collections:
  - name: blog
    label: "Articole Blog"
    path: "blog" # Folderul tău existent unde vrei să apară articolele
    type: file
    format: html # Îi spunem să îți creeze direct pagini .html, nu text/markdown!
    fields:
      - name: title
        label: "Titlu Articol (H1)"
        type: string
      - name: date
        label: "Data Publicării"
        type: date
      - name: meta_title
        label: "SEO Meta Title (În Google)"
        type: string
      - name: meta_description
        label: "SEO Meta Description (În Google)"
        type: text
      - name: body
        label: "Corp Articol (Text)"
        type: rich-text
